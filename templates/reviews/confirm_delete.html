{% extends 'base.html' %}

{% block title %}Confirmer la suppression | LITReview{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-section-box">
        <h2 class="form-title" style="margin-top: 0; font-size: 1.5rem;">Confirmer la suppression</h2>
        <p style="font-size: 1.1rem; text-align: center; margin-bottom: 2rem;">
            Êtes-vous sûr de vouloir supprimer {{ object_name }} ? Cette action est définitive.
        </p>
        <form method="post" style="text-align: center;">
            {% csrf_token %}
            <button type="submit" class="btn" style="background-color: #ff4d4d; color: white; border: none; margin-right: 1rem;">Confirmer la suppression</button>
            <a href="{% url cancel_url %}" class="btn">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
